name: Deploy to GitHub Pages

# Pages is enabled in "deploy from branch" mode, serving the gh-pages branch.
# This workflow gates deployment behind the test suite: every push to main
# runs engine tests + full content validation (compiling all code exercises),
# and only then mirrors main to gh-pages, which GitHub publishes.
#
# (If you later switch Settings → Pages → Source to "GitHub Actions", replace
# the deploy job with the actions/configure-pages + deploy-pages flow.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node tests/engine.test.js
      - name: Content validation (schema + compile/run all code exercises)
        run: node tests/validate-content.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish main to gh-pages
        run: git push origin HEAD:gh-pages --force
